<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
		<link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
		<link rel="apple-touch-icon" href="/favicon-dark.svg" />

		<!-- Set the theme before first paint so the correct palette is applied
		     without a flash: stored choice wins, else the OS preference. -->
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark = stored ? stored === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>

		<!-- Space Grotesk is self-hosted (@font-face in app.css). Preload the two
		     weights used above the fold so the swap happens before first paint. -->
		<link rel="preload" href="/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
